name: pipeline regression tests

on:
  push:
    # master is deliberately NOT here, and adding it was a mistake corrected the
    # same day. master is the published release artefact: it is roughly 10,000
    # lines behind the hardened pipeline across 27 files, and NONE of these
    # tests can run against it - they assert behaviour that only exists on the
    # development line (ERA5ValidationError, _validate_ingestion_source,
    # anchor_refs.ANCHOR_METHOD, a parameterised pi backfill). Triggering here
    # would guarantee a red result on the branch people clone.
    # CI belongs on the development line, which is where it already was.
    branches: [uncertainty-v1, hardening-2027-01]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.5"
          cache: pip
      - run: python -m pip install -r requirements-lab.lock
      - run: python scripts/check_environment.py lab
      - run: python -m unittest discover -s tests -v
