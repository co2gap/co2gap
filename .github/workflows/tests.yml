name: pipeline regression tests

on:
  push:
    # master is the published branch and was NOT in this list, so nothing ever
    # ran against what people actually clone. uncertainty-v1 carries the tests
    # themselves and the release-manifest tooling, so it guards them too.
    branches: [master, uncertainty-v1, hardening-2027-01]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.5"
          cache: pip
      - run: python -m pip install -r requirements-lab.lock
      - run: python scripts/check_environment.py lab
      - run: python -m unittest discover -s tests -v
