  <path d="M6 50 A26 11 0 0 1 58 50" fill="none" stroke="#8ea3b2" stroke-width="3"
        stroke-linecap="round" stroke-dasharray="5 4.5"/>
  <path d="M6 50 A26 25 0 0 1 32 25" fill="none" stroke="#ff7a55" stroke-width="3.6"
        stroke-linecap="round"/>
  <circle cx="6" cy="50" r="3.4" fill="#8ea3b2"/>
  <circle cx="58" cy="50" r="3.4" fill="#8ea3b2"/>
  <path fill="#ff7a55" transform="translate(41 27) rotate(24) scale(.92)"
        d="M10 0 C10 -1.3 8.2 -2.1 6 -2.3 L1.5 -2.5 L-5 -9 L-7.6 -9 L-4 -2.5
           L-6 -2.3 L-8 -5 L-9.6 -5 L-9.1 -1.5 L-9.1 1.5 L-9.6 5 L-8 5 L-6 2.3 L-4 2.5
           L-7.6 9 L-5 9 L1.5 2.5 L6 2.3 C8.2 2.1 10 1.3 10 0 Z"/>
